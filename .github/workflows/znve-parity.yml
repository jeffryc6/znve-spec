name: "ZNVE Specification Parity & Drift Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run ZNVE Drift Verification
        run: python znve-auto/test_sync.py

      - name: Verify workflow schemas and Python retirement
        run: python znve-auto/test_workflow_sync.py

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/mcp-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and run MCP regression suite
        run: npm test

      - name: Type-check OpenRouter client
        run: npm run check:openrouter
