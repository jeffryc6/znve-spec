name: "ZNVE Specification Parity & Drift Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ZNVE Drift Verification
        run: python znve-auto/test_sync.py

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/mcp-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and run MCP regression suite
        run: npm test

      - name: Type-check OpenRouter client
        run: npm run check:openrouter
