name: "ZNVE Specification Parity & Drift Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run ZNVE Drift Verification
        run: python znve-auto/test_sync.py

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/mcp-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and run MCP regression suite
        run: npm test

      - name: Type-check OpenRouter client
        run: npm run check:openrouter
